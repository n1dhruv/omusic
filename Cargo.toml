[package]
name = "omusic"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
libc = "0.2"
ksni = "0.3.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

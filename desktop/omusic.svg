<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1511"/>
      <stop offset="100%" stop-color="#17271f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5e5bf"/>
      <stop offset="100%" stop-color="#7ccba2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7ccba2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#7ccba2" stroke-opacity="0.25" stroke-width="2"/>
  <!-- Circular Accent Badge -->
  <circle cx="64" cy="64" r="38" fill="#101d17" stroke="#7ccba2" stroke-opacity="0.15" stroke-width="2"/>
  <!-- Playhead & Musical Note Symbol -->
  <path d="M 52 44 L 52 84 L 84 64 Z" fill="url(#accent)" filter="url(#glow)"/>
  <!-- Sound Wave Accents -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#a5e5bf" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 8"/>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>omusic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="backdrop" class="ambient-backdrop"></div>

  <div id="app" class="card-container">
    <!-- FULL PLAYER VIEW -->
    <div id="full-player" class="full-layout">
      <!-- LEFT SEARCH PANE (270px) -->
      <aside class="search-pane">
        <div class="section-label">SEARCH</div>
        <div class="search-input-box">
          <span id="search-icon" class="search-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="text" id="search-input" placeholder="Search YouTube Music..." autocomplete="off" />
          <button id="search-clear" class="btn-clear hidden" title="Clear">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="keyboard-hint">Enter Search · Click song to play</div>

        <div id="results-header" class="section-label hidden">RESULTS (0)</div>
        <div id="results-scroll" class="results-scroll custom-scrollbar hidden">
          <div id="results-list" class="results-list"></div>
          <button id="btn-load-more" class="btn-load-more hidden">✕ Load more songs</button>
        </div>
        <div id="search-placeholder" class="placeholder-box">
          Type a query and press Enter to search.
        </div>
      </aside>

      <!-- DIVIDER -->
      <div class="pane-divider"></div>

      <!-- RIGHT PLAYER STAGE -->
      <main class="player-stage">
        <!-- Header -->
        <div class="stage-header">
          <div class="header-left">
            <span id="player-label" class="section-label">PLAYER</span>
            <div id="header-eq" class="equalizer-bars hidden">
              <span class="bar b1"></span>
              <span class="bar b2"></span>
              <span class="bar b3"></span>
            </div>
          </div>
          <button id="btn-hide-window" class="btn-icon" title="Hide Player">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
        </div>

        <!-- Album Artwork -->
        <div class="art-wrapper">
          <div id="artwork-glow" class="art-glow"></div>
          <div id="artwork-box" class="artwork-container">
            <img id="artwork-img" class="art-img hidden" alt="Artwork" />
            <div id="artwork-fallback" class="art-fallback">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor" opacity="0.35">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- Metadata -->
        <div class="metadata-wrapper">
          <div id="track-title" class="track-title">YouTube Music</div>
          <div id="track-artist" class="track-artist">Search or select a song to begin</div>
        </div>

        <!-- Transport Controls -->
        <div class="controls-row">
          <button id="btn-shuffle" class="btn-ctrl" title="Shuffle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
          </button>
          <button id="btn-prev" class="btn-ctrl" title="Previous">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="19,20 9,12 19,4"></polygon>
              <rect x="4" y="4" width="2.5" height="16" rx="0.5"></rect>
            </svg>
          </button>
          <button id="btn-play" class="btn-play" title="Play / Pause">
            <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="7,4 20,12 7,20"></polygon>
            </svg>
            <svg id="icon-pause" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <rect x="5" y="4" width="4" height="16" rx="1"></rect>
              <rect x="15" y="4" width="4" height="16" rx="1"></rect>
            </svg>
          </button>
          <button id="btn-next" class="btn-ctrl" title="Next">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5,4 15,12 5,20"></polygon>
              <rect x="17.5" y="4" width="2.5" height="16" rx="0.5"></rect>
            </svg>
          </button>
          <button id="btn-repeat" class="btn-ctrl" title="Repeat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
          </button>
        </div>

        <!-- Progress Bar -->
        <div class="progress-section">
          <div id="progress-track" class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
            <div id="progress-knob" class="progress-knob"></div>
          </div>
          <div class="timestamps-row">
            <span id="pos-label">0:00</span>
            <span id="dur-label">0:00</span>
          </div>
        </div>

        <!-- Volume Row -->
        <div class="volume-row">
          <button id="btn-mute" class="btn-icon" title="Mute">
            <svg id="icon-vol" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg id="icon-mute" class="hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
          <input type="range" id="volume-slider" min="0" max="100" value="100" class="vol-slider" />
          <span id="volume-label" class="vol-pct">100%</span>
        </div>

        <div class="sub-divider"></div>

        <!-- Queue Section -->
        <div class="queue-header">
          <span id="queue-title" class="section-label">Queue</span>
          <button id="btn-clear-queue" class="btn-text-subtle hidden">Clear</button>
        </div>

        <div id="queue-scroll" class="queue-scroll custom-scrollbar">
          <div id="queue-list" class="queue-list"></div>
          <div id="queue-empty" class="queue-empty-label">
            Queue is empty. Search for a song or click + to add.
          </div>
        </div>
      </main>
    </div>

    <!-- BOTTOM KEYBOARD HINTS BAR -->
    <footer class="bottom-hints-bar">
      <div class="hints-list">
        <span class="key">Space</span><span class="desc">Play/Pause</span>
        <span class="key">J/K</span><span class="desc">Navigate</span>
        <span class="key">Enter</span><span class="desc">Play</span>
        <span class="key">Q</span><span class="desc">Queue</span>
        <span class="key">/</span><span class="desc">Search</span>
      </div>
      <div class="branding">Omarchy Music</div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
